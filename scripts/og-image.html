<!doctype html>
<!--
  Source for public/og-image.png (the 1200x630 link-preview image).
  Regenerate after editing (Windows, uses the Edge that ships with Windows; Chrome works the same way):
    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot="%CD%\public\og-image.png" "%CD%\scripts\og-image.html"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0a0a0a;
        color: #fff;
        font-family: "Geist", system-ui, sans-serif;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 45% 90% at 50% -25%, rgba(37, 99, 235, 0.45), transparent 70%);
      }
      .grid {
        position: absolute;
        left: -50%;
        right: -50%;
        bottom: -40%;
        height: 85%;
        background-image:
          linear-gradient(to right, #262626 1px, transparent 0),
          linear-gradient(to bottom, #262626 1px, transparent 0);
        background-size: 56px 56px;
        transform: perspective(300px) rotateX(60deg);
        transform-origin: 50% 0;
        mask-image: linear-gradient(to bottom, transparent, #000 60%);
      }
      .content { position: relative; }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .mark {
        height: 44px;
        width: auto;
        filter: brightness(1.35) saturate(1.1) drop-shadow(0 0 8px rgba(59, 130, 246, 0.75));
      }
      h1 {
        margin-top: 48px;
        font-size: 72px;
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.04em;
        max-width: 960px;
      }
      h1 span {
        background: linear-gradient(90deg, #60a5fa, #7dd3fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .footer {
        position: relative;
        display: flex;
        gap: 16px;
        font-size: 24px;
        color: #d4d4d4;
      }
      .pill {
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 10px 22px;
        background: rgba(10, 10, 10, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="content">
      <div class="brand"><img class="mark" src="../src/assets/brand/signalfill-mark-84.png" alt="" />SignalFill</div>
      <h1>Qualified sales calls, <span>booked for MSPs.</span></h1>
    </div>
    <div class="footer">
      <span class="pill">Signal-based cold email</span>
      <span class="pill">One MSP per metro</span>
    </div>
  </body>
</html>
