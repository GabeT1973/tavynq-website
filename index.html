<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- {{...}} placeholders are filled from src/config/site.ts at build time (see vite.config.ts). -->
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{url}}/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{name}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}/" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ogImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImage}}" />
    <meta name="twitter:image:alt" content="{{ogImageAlt}}" />

    <!-- Icons are a manually-sourced favicon pack (signal-pulse mark, #08122a background),
         replacing the auto-generated set from scripts/generate-brand-assets.mjs as of
         2026-10-10 (see that script's header comment). Bump ?v= on every link below, and in
         site.webmanifest, when any of these files change. -->
    <link rel="icon" href="/favicon.ico?v=5" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=5" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=5" />

    <!-- Apple / iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SignalFill" />

    <!-- Android / Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#08122A" />

    <!-- Windows / other -->
    <meta name="msapplication-TileColor" content="#08122A" />
    <meta name="msapplication-TileImage" content="/icon-192.png?v=5" />

    <link rel="manifest" href="/site.webmanifest?v=5" />

    <script type="application/ld+json">{{jsonLd}}</script>

    <!-- Apply the saved (or system) theme before first paint. Keep the "theme" key in sync with src/lib/theme.tsx. -->
    <script>
      (function () {
        var dark = true
        try {
          var stored = localStorage.getItem("theme")
          dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches
        } catch (e) {}
        var root = document.documentElement
        if (dark) root.classList.add("dark")
        root.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
