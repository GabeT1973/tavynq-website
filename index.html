<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- {{...}} placeholders are filled from src/config/site.ts at build time (see vite.config.ts). -->
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{url}}/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{name}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}/" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ogImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{ogImage}}" />
    <meta name="twitter:image:alt" content="{{ogImageAlt}}" />

    <!-- Icons are generated by scripts/generate-brand-assets.mjs from the vector mark in
         logo.tsx (signal-pulse mark, as of 2026-10-10). Bump ?v= on every link below, and in
         site.webmanifest, when any of these files change. -->
    <link rel="icon" href="/favicon.ico?v=6" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />
    <link rel="manifest" href="/site.webmanifest?v=6" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-title" content="SignalFill" />

    <script type="application/ld+json">{{jsonLd}}</script>

    <!-- Apply the saved (or system) theme before first paint. Keep the "theme" key in sync with src/lib/theme.tsx. -->
    <script>
      (function () {
        var dark = true
        try {
          var stored = localStorage.getItem("theme")
          dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches
        } catch (e) {}
        var root = document.documentElement
        if (dark) root.classList.add("dark")
        root.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
